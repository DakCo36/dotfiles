### Terminal
[alacritty]
version = "latest"
fallback_version = "0.16.1"
source = "cargo"

[[alacritty.resources]]
type = "github_release"
owner = "alacritty"
repo = "alacritty"
asset = "Alacritty.desktop"
destination = "~/.local/share/applications/Alacritty.desktop"

[[alacritty.resources]]
type = "github_release"
owner = "alacritty"
repo = "alacritty"
asset = "Alacritty.svg"
destination = "~/.local/share/icons/hicolor/scalable/apps/Alacritty.svg"

[[alacritty.resources]]
type = "github_release"
owner = "alacritty"
repo = "alacritty"
asset = "alacritty.info"
destination = "~/.terminfo/alacritty.info"

[[alacritty.resources]]
type = "github_release"
owner = "alacritty"
repo = "alacritty"
asset = "_alacritty"
destination = "~/.local/share/zsh/site-functions/_alacritty"

[[alacritty.resources]]
type = "github_release"
owner = "alacritty"
repo = "alacritty"
asset = "alacritty.1.gz"
destination = "~/.local/share/man/man1/alacritty.1.gz"

[[alacritty.resources]]
type = "github_release"
owner = "alacritty"
repo = "alacritty"
asset = "alacritty-msg.1.gz"
destination = "~/.local/share/man/man1/alacritty-msg.1.gz"

[[alacritty.resources]]
type = "github_release"
owner = "alacritty"
repo = "alacritty"
asset = "alacritty.5.gz"
destination = "~/.local/share/man/man5/alacritty.5.gz"

[[alacritty.resources]]
type = "github_release"
owner = "alacritty"
repo = "alacritty"
asset = "alacritty-bindings.5.gz"
destination = "~/.local/share/man/man5/alacritty-bindings.5.gz"

