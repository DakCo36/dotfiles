# Dotfiles Configuration
#
# version: "latest" = always use latest, "x.y.z" = pin to specific version
# Git-based components use branch or commit
#
# Resource types:
#   type = "local"          - Copy file from devkit resources/ directory
#   type = "github_release" - Download asset from GitHub release

[settings]
log_level = "debug"

### Editors
[neovim]
version = "latest"
fallback_version = "0.11.6"
source = "github"
owner = "neovim"
repo = "neovim"

[[neovim.resources]]
type = "local"
source = "resources/neovim/init.vim"
destination = "~/.config/nvim/init.vim"

[[neovim.resources]]
type = "local"
source = "resources/neovim/.vimrc"
destination = "~/.vimrc"

[emacs]
version = "latest"
fallback_version = "30.2"
source = "download"

[[emacs.resources]]
type = "local"
source = "resources/emacs/init.el"
destination = "~/.emacs.d/init.el"

[[emacs.resources]]
type = "local"
source = "resources/emacs/lisp/appearance.el"
destination = "~/.emacs.d/lisp/appearance.el"

[[emacs.resources]]
type = "local"
source = "resources/emacs/lisp/modules/my-treemacs.el"
destination = "~/.emacs.d/lisp/modules/my-treemacs.el"

[[emacs.resources]]
type = "local"
source = "resources/emacs/lisp/languages.el"
destination = "~/.emacs.d/lisp/languages.el"

[[emacs.resources]]
type = "local"
source = "resources/emacs/lisp/markdown.el"
destination = "~/.emacs.d/lisp/markdown.el"

[[emacs.resources]]
type = "local"
source = "resources/emacs/lisp/themes.el"
destination = "~/.emacs.d/lisp/themes.el"

[[emacs.resources]]
type = "local"
source = "resources/emacs/lisp/init-dashboard.el"
destination = "~/.emacs.d/lisp/init-dashboard.el"

[treesitter]
version = "0.24.7"
source = "git"

