# Dotfiles Configuration
#
# version: "latest" = always use latest, "x.y.z" = pin to specific version
# Git-based components use branch or commit
#
# Resource types:
#   type = "local"          - Copy file from devkit resources/ directory
#   type = "github_release" - Download asset from GitHub release

[settings]
log_level = "debug"

### Editors
[neovim]
version = "latest"
fallback_version = "0.11.6"
source = "github"
owner = "neovim"
repo = "neovim"

[[neovim.resources]]
type = "local"
source = "resources/neovim/init.vim"
destination = "~/.config/nvim/init.vim"

[[neovim.resources]]
type = "local"
source = "resources/neovim/.vimrc"
destination = "~/.vimrc"

### Shell
[zsh]
version = "latest"
source = "download"

[oh-my-zsh]
version = "latest"
source = "git"
repo = "https://github.com/ohmyzsh/ohmyzsh.git"
branch = "master"

[zgenom]
version = "latest"
source = "git"
repo = "https://github.com/jandamm/zgenom.git"
branch = "main"

[powerlevel10k]
version = "latest"
source = "git"
repo = "https://github.com/romkatv/powerlevel10k.git"
branch = "master"

[[powerlevel10k.resources]]
type = "local"
source = "resources/p10k/simple.zsh"
destination = "~/.p10k.zsh"

